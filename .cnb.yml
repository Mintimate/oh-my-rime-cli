.sync_pipeline: &sync_pipeline
  imports:
    - https://cnb.cool/Mintimate/secret/-/blob/main/SyncToGitHub.yml
  stages:
    - name: 自动同步代码
      image: tencentcom/git-sync
      settings:
        target_url: https://github.com/Mintimate/oh-my-rime-cli.git
        auth_type: https
        username: ${GIT_USERNAME}
        password: ${GIT_ACCESS_TOKEN}
        force: true
        push_tags: true

main:
  push:
    - *sync_pipeline

$:
  tag_push:
    - *sync_pipeline
    - name: 测试 Web 与 Rust 核心
      docker:
        image: rust:1.88-bookworm
      stages:
        - name: 安装 Node.js
          script: |
            apt-get update && apt-get install -y nodejs npm libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
        - name: 安装依赖并测试
          script: |
            npm ci
            npm run typecheck
            npm run build:web
            cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
            cargo test --manifest-path src-tauri/Cargo.toml
