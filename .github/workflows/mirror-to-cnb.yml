name: 同步到 CNB

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-to-cnb
  cancel-in-progress: false

jobs:
  sync:
    name: 同步源码或已发布标签
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: 检出完整仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || 'main' }}

      - name: 检查 CNB 凭据
        env:
          CNB_GIT_PASSWORD: ${{ secrets.CNB_GIT_PASSWORD }}
        shell: bash
        run: |
          if [[ -z "${CNB_GIT_PASSWORD}" ]]; then
            echo "::error::请先配置 Actions Secret：CNB_GIT_PASSWORD"
            exit 1
          fi

      - name: 同步 main
        if: github.event_name != 'workflow_run'
        env:
          CNB_GIT_PASSWORD: ${{ secrets.CNB_GIT_PASSWORD }}
        shell: bash
        run: |
          umask 077
          askpass="${RUNNER_TEMP}/cnb-git-askpass.sh"
          cat > "${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'cnb' ;;
            *Password*) printf '%s\n' "${CNB_GIT_PASSWORD}" ;;
          esac
          EOF
          chmod 700 "${askpass}"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git push \
            "https://cnb.cool/Mintimate/rime/oh-my-rime-cli.git" \
            "HEAD:refs/heads/main"

      - name: 同步已发布标签并触发 CNB 拉取
        if: github.event_name == 'workflow_run'
        env:
          CNB_GIT_PASSWORD: ${{ secrets.CNB_GIT_PASSWORD }}
        shell: bash
        run: |
          RELEASE_TAG="v$(jq -r '.version' src-tauri/tauri.conf.json)"
          if [[ ! "${RELEASE_TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::无法从已发布源码读取有效版本标签：${RELEASE_TAG}"
            exit 1
          fi

          git fetch origin \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          test "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$(git rev-parse HEAD)"

          umask 077
          askpass="${RUNNER_TEMP}/cnb-git-askpass.sh"
          cat > "${askpass}" <<'EOF'
          #!/usr/bin/env bash
          case "$1" in
            *Username*) printf '%s\n' 'cnb' ;;
            *Password*) printf '%s\n' "${CNB_GIT_PASSWORD}" ;;
          esac
          EOF
          chmod 700 "${askpass}"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git push \
            "https://cnb.cool/Mintimate/rime/oh-my-rime-cli.git" \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
