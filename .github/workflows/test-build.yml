name: Test Build

on:
  push:
    branches: [main, master, rust-ui]
  pull_request:
    branches: [main, master, rust-ui]

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: node --test .github/scripts/*.test.mjs
      - run: npm run typecheck
      - run: npm run build:web
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features cli
      - run: cargo build --manifest-path src-tauri/Cargo.toml --release --features cli --bin oh-my-rime-cli
