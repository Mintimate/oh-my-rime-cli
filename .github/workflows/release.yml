name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v2.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Linux WebKit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:web
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  build-app:
    name: ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            runner: macos-14
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_target: aarch64-apple-darwin
            asset_os: macOS
            asset_arch: arm64
          - name: macOS Intel
            runner: macos-13
            args: --target x86_64-apple-darwin --bundles app,dmg
            rust_target: x86_64-apple-darwin
            asset_os: macOS
            asset_arch: x64
          - name: Windows x64
            runner: windows-latest
            args: --bundles msi,nsis
            rust_target: ""
            asset_os: Windows
            asset_arch: x64
          - name: Linux x64
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            rust_target: ""
            asset_os: Linux
            asset_arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - name: Install Linux dependencies
        if: startsWith(matrix.runner, 'ubuntu-')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - name: Build and upload Tauri bundles
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Oh My Rime ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          releaseBody: "See the generated release notes for changes in this version."
          releaseAssetNamePattern: Oh-My-Rime_[version]_${{ matrix.asset_os }}_${{ matrix.asset_arch }}[setup][ext]

  build-cli:
    name: CLI ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            target: aarch64-apple-darwin
            suffix: macos-arm64
          - name: macOS x64
            runner: macos-13
            target: x86_64-apple-darwin
            suffix: macos-x64
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            suffix: linux-x64
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x64.exe
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build CLI
        shell: bash
        run: cargo build --manifest-path src-tauri/Cargo.toml --release --target ${{ matrix.target }} --bin oh-my-rime-cli
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.suffix }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/oh-my-rime-cli*

  publish:
    name: Publish release
    needs: [build-app, build-cli]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: cli
          pattern: cli-*
          merge-multiple: true
      - name: Upload CLI assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${RELEASE_TAG}" cli/* --clobber
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${RELEASE_TAG}" --draft=false
